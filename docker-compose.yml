version: '3.8'

services:
  # =========================================================================
  # 1. PostgreSQL 15 - מסד נתונים מבודד לחלוטין עבור תקציב הבית
  # =========================================================================
  home_budget_db:
    image: postgres:15-alpine
    container_name: home_budget_db
    restart: always
    environment:
      POSTGRES_DB: home_budget
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HomeBudgetSecurePass2026!
    volumes:
      - home_budget_data_v1:/var/lib/postgresql/data
    networks:
      - home_budget_net

  # =========================================================================
  # 2. Schema Initializer - מוודא יצירת סכמת auth, טיפוסי נתונים והרחבות
  # =========================================================================
  home_budget_init:
    image: postgres:15-alpine
    container_name: home_budget_init
    restart: "no"
    depends_on:
      - home_budget_db
    networks:
      - home_budget_net
    entrypoint: >
      sh -c "until pg_isready -h home_budget_db -U postgres; do sleep 1; done;
      PGPASSWORD=HomeBudgetSecurePass2026! psql -h home_budget_db -U postgres -d home_budget -c '
      CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
      CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";
      CREATE SCHEMA IF NOT EXISTS auth;
      ALTER DATABASE home_budget SET search_path TO auth, public;
      ALTER ROLE postgres SET search_path TO auth, public;
      ';"

  # =========================================================================
  # 3. PostgREST - מנוע REST API לשליפה ועדכון טבלאות האפליקציה
  # =========================================================================
  home_budget_rest:
    image: postgrest/postgrest:v12.2.0
    container_name: home_budget_rest
    restart: always
    depends_on:
      - home_budget_db
    environment:
      PGRST_DB_URI: "postgres://postgres:HomeBudgetSecurePass2026!@home_budget_db:5432/home_budget"
      PGRST_DB_SCHEMA: "public"
      PGRST_DB_ANON_ROLE: "postgres"
      PGRST_JWT_SECRET: "HomeBudgetSuperSecretJWTKey2026AtLeast32Chars!"
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: "*"
    networks:
      - home_budget_net

  # =========================================================================
  # 4. Supabase GoTrue - שירות אימות יציב (LTS v2.132.3) מול Google OAuth
  # =========================================================================
  home_budget_auth:
    image: supabase/gotrue:v2.132.3
    container_name: home_budget_auth
    restart: always
    depends_on:
      - home_budget_db
      - home_budget_init
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "https://budget-db.liarzi.com/auth/v1"
      GOTRUE_API_EXTERNAL_URL: "https://budget-db.liarzi.com/auth/v1"
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: "postgres://postgres:HomeBudgetSecurePass2026!@home_budget_db:5432/home_budget?sslmode=disable"
      DATABASE_URL: "postgres://postgres:HomeBudgetSecurePass2026!@home_budget_db:5432/home_budget?sslmode=disable"
      GOTRUE_SITE_URL: "https://home-budget-coral.vercel.app"
      GOTRUE_URI_ALLOW_LIST: "https://home-budget-coral.vercel.app,https://home-budget-coral.vercel.app/*,http://localhost:5173,http://localhost:5173/*"
      GOTRUE_ADDITIONAL_REDIRECT_URLS: "https://home-budget-coral.vercel.app,https://home-budget-coral.vercel.app/*,http://localhost:5173,http://localhost:5173/*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: "HomeBudgetSuperSecretJWTKey2026AtLeast32Chars!"
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: "authenticated"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: "authenticated"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID"
      GOTRUE_EXTERNAL_GOOGLE_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: "https://budget-db.liarzi.com/auth/v1/callback"
    networks:
      - home_budget_net

  # =========================================================================
  # 5. Gateway Proxy (Nginx) - שער גישה בפורט 8100 עם DNS Resolver עמיד
  # =========================================================================
  home_budget_gateway:
    image: nginx:alpine
    container_name: home_budget_gateway
    restart: always
    ports:
      - "8100:80"
    depends_on:
      - home_budget_rest
      - home_budget_auth
    command: >
      sh -c "echo 'server { listen 80; client_max_body_size 50M; resolver 127.0.0.11 ipv6=off valid=5s; location ~ ^/auth/v1/(.*)\$$ { if (\$$request_method = \"OPTIONS\") { add_header \"Access-Control-Allow-Origin\" \"*\" always; add_header \"Access-Control-Allow-Methods\" \"GET, POST, PUT, PATCH, DELETE, OPTIONS\" always; add_header \"Access-Control-Allow-Headers\" \"*\" always; return 204; } set \$$upstream_auth http://home_budget_auth:9999; proxy_pass \$$upstream_auth/\$$1\$$is_args\$$args; proxy_set_header Host \$$host; proxy_set_header X-Real-IP \$$remote_addr; proxy_set_header X-Forwarded-Proto https; } location ~ ^/rest/v1/(.*)\$$ { if (\$$request_method = \"OPTIONS\") { add_header \"Access-Control-Allow-Origin\" \"*\" always; add_header \"Access-Control-Allow-Methods\" \"GET, POST, PUT, PATCH, DELETE, OPTIONS\" always; add_header \"Access-Control-Allow-Headers\" \"*\" always; return 204; } add_header \"Access-Control-Allow-Origin\" \"*\" always; add_header \"Access-Control-Allow-Methods\" \"GET, POST, PUT, PATCH, DELETE, OPTIONS\" always; add_header \"Access-Control-Allow-Headers\" \"*\" always; add_header \"Access-Control-Expose-Headers\" \"*\" always; set \$$upstream_rest http://home_budget_rest:3000; proxy_pass \$$upstream_rest/\$$1\$$is_args\$$args; proxy_set_header Host \$$host; proxy_set_header X-Real-IP \$$remote_addr; proxy_set_header X-Forwarded-Proto https; } location /health { return 200 OK; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - home_budget_net

  # =========================================================================
  # 6. Adminer Web DB Manager - לצפייה וניהול מסד הנתונים מהדפדפן (פורט 8088)
  # =========================================================================
  home_budget_adminer:
    image: adminer:latest
    container_name: home_budget_adminer
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      - home_budget_db
    networks:
      - home_budget_net

networks:
  home_budget_net:
    driver: bridge

volumes:
  home_budget_data_v1:
